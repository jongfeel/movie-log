name: 🎬 영화 기록
description: 본 영화를 기록합니다. 제목은 "한글 제목 (영어 제목)" 형식으로 적어 주세요. 예: 눈 내리는 여름, 너에게 (Snow in June)
type: Movie
body:
  - type: input
    id: watched
    attributes:
      label: 관람일
      description: YYYY-MM-DD 형식
      placeholder: "2026-11-08"
    validations:
      required: true
  - type: input
    id: released
    attributes:
      label: 개봉일
      description: 최초 국내 개봉일, YYYY-MM-DD 형식
      placeholder: "2015-10-29"
    validations:
      required: true
  - type: input
    id: rereleased
    attributes:
      label: 재개봉일
      description: 재개봉 상영을 봤을 때만 적어 주세요. YYYY-MM-DD 형식
      placeholder: "2026-11-11"
  - type: textarea
    id: poster
    attributes:
      label: 포스터
      description: 가로 500px 정도의 세로형 이미지를 붙여넣거나 끌어다 놓으세요. 첫 번째 이미지만 사용합니다. 이미지 URL도 가능합니다.
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: 관람 장소
      placeholder: "멀티플렉스 브랜드(CGV, 롯데시네마, 메가박스, 씨네큐) / 지역(청라, 용산아이파크몰, 인천아시아드)"
  - type: textarea
    id: title_meaning
    attributes:
      label: 1. 영화 제목의 의미
  - type: textarea
    id: poster_reading
    attributes:
      label: 2. 영화 포스터 해석
  - type: textarea
    id: background
    attributes:
      label: 3. 영화 속 배경
